name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'WpfLearningLab.code-workspace'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'WpfLearningLab.code-workspace'
      - '.gitignore'
  schedule:
    # 毎週月曜 9:00 JST（UTC日曜 24:00）に全プロジェクトを対象として実行する
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  # このいずれかが変更されている場合は、通常時のpush/pull_requestであっても全プロジェクトを対象にする
  COMMON_FILES: "Directory.Build.props,WpfLearningLab.slnx,.github/workflows/ci.yml"

jobs:
  detect-changes:
    name: Detect Changed Projects
    runs-on: windows-latest
    outputs:
      projects: ${{ steps.detect.outputs.projects }}
      has_projects: ${{ steps.detect.outputs.has_projects }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed projects
        id: detect
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $full = $false
          $changedFiles = @()

          if ($eventName -eq "schedule" -or $eventName -eq "workflow_dispatch") {
            # 週次の定期実行、および手動実行は常に全プロジェクトを対象にする
            $full = $true
          }
          elseif ($eventName -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
            $changedFiles = git diff --name-only $base HEAD
          }
          elseif ($eventName -eq "push") {
            $before = "${{ github.event.before }}"
            if ($before -match '^0+$') {
              # 新規ブランチ作成直後などdiff元が存在しない場合は安全側に倒して全体を対象にする
              $full = $true
            } else {
              $changedFiles = git diff --name-only $before HEAD
            }
          }
          else {
            $full = $true
          }

          $commonFiles = "${{ env.COMMON_FILES }}" -split ','
          foreach ($f in $changedFiles) {
            if ($commonFiles -contains $f) {
              $full = $true
            }
          }

          $allProjects = @(Get-ChildItem -Directory -Name | Where-Object { $_ -match '^\d{2}_' } | Sort-Object)

          if ($full) {
            $targetProjects = $allProjects
          } else {
            $targetProjects = @(
              $changedFiles |
                ForEach-Object { ($_ -replace '\\', '/') -split '/' | Select-Object -First 1 } |
                Where-Object { $allProjects -contains $_ } |
                Sort-Object -Unique
            )
          }

          if ($targetProjects.Count -eq 0) {
            $json = "[]"
          } else {
            $json = ConvertTo-Json -InputObject $targetProjects -Compress
            if ($targetProjects.Count -eq 1) { $json = "[$json]" }
          }

          Write-Host "full=$full"
          Write-Host "targetProjects=$($targetProjects -join ', ')"

          "projects=$json" >> $env:GITHUB_OUTPUT
          "has_projects=$($targetProjects.Count -gt 0)" >> $env:GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.project }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has_projects == 'True'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.projects) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build "${{ matrix.project }}" --configuration Release

      - name: Test
        shell: pwsh
        run: |
          $testDir = "${{ matrix.project }}/test"
          if (Test-Path $testDir) {
            dotnet test $testDir --configuration Release
          } else {
            Write-Host "No test project under $testDir, skipping."
          }

  static-analysis:
    name: Static Analysis (${{ matrix.project }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has_projects == 'True'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        project: ${{ fromJson(needs.detect-changes.outputs.projects) }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "C#: format check (main project)"
        continue-on-error: true
        run: dotnet format "${{ matrix.project }}" --verify-no-changes

      - name: "C#: format check (test project)"
        continue-on-error: true
        shell: pwsh
        run: |
          $testDir = "${{ matrix.project }}/test"
          if (Test-Path $testDir) {
            dotnet format $testDir --verify-no-changes
          } else {
            Write-Host "No test project under $testDir, skipping."
          }
