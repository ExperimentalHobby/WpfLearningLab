name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'WpfLearningLab.code-workspace'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'WpfLearningLab.code-workspace'
      - '.gitignore'
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: WpfLearningLab.slnx

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release

  static-analysis:
    name: Static Analysis
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "C#: format check"
        continue-on-error: true
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes
